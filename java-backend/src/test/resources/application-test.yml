spring:
  datasource:
    url: jdbc:h2:mem:procure_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 6399
      timeout: 200ms
      connect-timeout: 200ms

app:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-long-enough
  rate-limit:
    enabled: true
    mode: memory
  agent:
    base-url: http://127.0.0.1:1
    callback-secret: test-callback-secret

logging:
  level:
    com.phh.procure: INFO
    org.flywaydb: INFO
