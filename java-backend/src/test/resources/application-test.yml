spring:
  datasource:
    url: jdbc:h2:mem:procure_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 6399
      timeout: 200ms
      connect-timeout: 200ms

app:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-long-enough
  rate-limit:
    # 默认关闭：各测试类共享同一个内存计数器，登录接口 10 次/分钟会让用例互相干扰。
    # 限流本身由 RateLimitApiTest 用独立配置 + 独立 H2 库单独验证。
    enabled: false
    mode: memory
  agent:
    base-url: http://127.0.0.1:1
    callback-secret: test-callback-secret

logging:
  level:
    com.phh.procure: INFO
    org.flywaydb: INFO
