server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: procure-agent-java
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:procure_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 800ms
      connect-timeout: 800ms
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  mvc:
    async:
      request-timeout: 1800000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:procure-agent-demo-secret-key-change-me-2026-please}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  agent:
    base-url: ${AGENT_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:internal-token-demo}
    callback-secret: ${AGENT_CALLBACK_SECRET:callback-secret-demo}
    callback-url: ${AGENT_CALLBACK_URL:http://127.0.0.1:8080/internal/agent/callback}
    mock-mode: ${AGENT_MOCK_MODE:true}
    connect-timeout-ms: ${AGENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AGENT_READ_TIMEOUT_MS:60000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    mode: ${RATE_LIMIT_MODE:auto}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

logging:
  level:
    com.phh.procure: INFO
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
